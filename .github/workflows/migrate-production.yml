name: Production Database Migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type MIGRATE to confirm running production Prisma migrations"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirmation == 'MIGRATE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not configured for the production environment." >&2
            exit 1
          fi

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Show migration status
        run: npx prisma migrate status

      - name: Apply pending production migrations
        run: npm run prisma:deploy

      - name: Record migration summary
        shell: bash
        run: |
          {
            echo "## Production migration complete"
            echo
            echo "Prisma migrate deploy finished successfully."
            echo "Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
