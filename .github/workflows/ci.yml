name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: maco
          POSTGRES_PASSWORD: maco
          POSTGRES_DB: maco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U maco -d maco_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://maco:maco@localhost:5432/maco_test
      JWT_SECRET: ci-test-secret
      RESEND_API_KEY: re_test_placeholder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prepare test database
        run: npx prisma db push

      - name: Build backend
        run: npm run build

      - name: Run integration tests
        run: npm test
