name: Backend CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: maco
          POSTGRES_PASSWORD: maco
          POSTGRES_DB: maco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U maco -d maco_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://maco:maco@localhost:5432/maco_test
      JWT_SECRET: ci-test-secret
      RESEND_API_KEY: re_test_placeholder
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migration chain to isolated test database
        run: npm run prisma:deploy

      - name: Verify migration status
        run: npx prisma migrate status

      - name: Build backend
        run: npm run build

      - name: Run integration tests
        shell: bash
        run: |
          set +e
          npm test -- --runInBand 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}

          {
            echo "## Backend CI summary"
            echo
            echo "- Prisma schema: validated"
            echo "- Prisma client: generated"
            echo "- Migration chain: applied successfully to fresh Postgres"
            echo "- Migration status: clean"
            echo "- TypeScript build: passed"
            echo
            grep -E "^(Test Suites:|Tests:|Snapshots:|Time:)" test-output.txt || true
          } >> "$GITHUB_STEP_SUMMARY"

          exit $status
